<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="background" x1="70" y1="44" x2="450" y2="478" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a374b"/>
      <stop offset="0.55" stop-color="#172231"/>
      <stop offset="1" stop-color="#0b111b"/>
    </linearGradient>
    <linearGradient id="gold" x1="70" y1="42" x2="442" y2="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f6d787"/>
      <stop offset="0.42" stop-color="#b97822"/>
      <stop offset="0.75" stop-color="#f0c46a"/>
      <stop offset="1" stop-color="#865216"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.42" cy="0.34" r="0.68">
      <stop offset="0" stop-color="#60758e" stop-opacity="0.48"/>
      <stop offset="1" stop-color="#172231" stop-opacity="0"/>
    </radialGradient>
    <filter id="region-shadow" x="-25%" y="-25%" width="150%" height="165%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="11" result="blur"/>
      <feOffset in="blur" dx="0" dy="15" result="offset"/>
      <feColorMatrix in="offset" type="matrix"
        values="0 0 0 0 0.015  0 0 0 0 0.025  0 0 0 0 0.04  0 0 0 0.85 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="plate-shadow" x="-20%" y="-35%" width="150%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#05080d" flood-opacity="0.9"/>
    </filter>
    <clipPath id="frame-clip">
      <rect x="26" y="26" width="460" height="460" rx="58"/>
    </clipPath>
  </defs>

  <rect x="14" y="14" width="484" height="484" rx="70" fill="#090e16"/>
  <rect x="25" y="25" width="462" height="462" rx="60" fill="url(#background)" stroke="url(#gold)" stroke-width="8"/>
  <rect x="39" y="39" width="434" height="434" rx="49" fill="none" stroke="#fff0bd" stroke-opacity="0.58" stroke-width="3"/>

  <g clip-path="url(#frame-clip)">
    <rect x="26" y="26" width="460" height="460" fill="url(#glow)"/>
    <path d="M26 151 C115 116 166 146 235 115 S375 65 486 100" fill="none" stroke="#dbe5ec" stroke-opacity="0.08" stroke-width="3"/>
    <path d="M26 310 C110 272 170 311 243 279 S389 231 486 270" fill="none" stroke="#dbe5ec" stroke-opacity="0.07" stroke-width="3"/>
    <path d="M72 26 C62 116 100 177 73 240 S61 388 113 486" fill="none" stroke="#dbe5ec" stroke-opacity="0.06" stroke-width="3"/>
    <path d="M378 26 C353 94 389 161 361 219 S355 376 426 486" fill="none" stroke="#dbe5ec" stroke-opacity="0.06" stroke-width="3"/>
  </g>

  <image x="35" y="42" width="418" height="418"
         preserveAspectRatio="xMidYMid meet"
         href="vanilla_map_modes/region.png"
         xlink:href="vanilla_map_modes/region.png"
         filter="url(#region-shadow)"/>

  <g transform="translate(246 364)" filter="url(#plate-shadow)">
    <rect x="0" y="0" width="231" height="101" rx="21" fill="#0c1421" fill-opacity="0.96" stroke="url(#gold)" stroke-width="6"/>
    <rect x="10" y="10" width="211" height="81" rx="13" fill="none" stroke="#fff1c2" stroke-opacity="0.42" stroke-width="2"/>
    <text x="116" y="68"
          text-anchor="middle"
          fill="#fff0c2"
          stroke="#5a3510" stroke-width="1.4" paint-order="stroke fill"
          font-family="Arial Black, Helvetica Neue, Arial, sans-serif"
          font-size="49" font-weight="900" letter-spacing="3">STATS</text>
  </g>
</svg>
